[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-research"
version = "2.0.0"
description = "Top-down financial research workbench — Dash/Plotly web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ada Research" }]

dependencies = [
    "dash>=2.14",
    "plotly>=5.18",
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fredapi>=0.5",
    "anthropic>=0.40",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ada-research = "ada_research.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ada_research" = ["data/*.txt", "assets/*.css"]
